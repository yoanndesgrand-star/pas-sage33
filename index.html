<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAS-SAGE 33</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Questrial&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;1,6..96,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Questrial', sans-serif;
  background: #0a0808;
  color: #f5f0e8;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  overflow: hidden;
}

.hero-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.hero-bg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 30% center;
}
/* Minimal overlay — the door is already dark */
.hero-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(to top, rgba(8,6,5,0.25) 0%, transparent 15%),
    linear-gradient(to bottom, rgba(8,6,5,0.15) 0%, transparent 8%);
}

/* Text pinned to right side, below the plaque */
.hero-content {
  position: absolute;
  z-index: 1;
  right: 3vw;
  top: 55%;
  text-align: center;
  width: 220px;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero-verse {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: 0.9rem;
  line-height: 2.2;
  color: rgba(232,213,176,0.8);
  margin-bottom: 24px;
  animation: fadeUp 1s 0.5s both;
}

.hero-details {
  font-family: 'Questrial', sans-serif;
  font-size: 0.45rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(201,169,110,0.5);
  line-height: 2;
  margin-bottom: 20px;
  animation: fadeUp 1s 0.7s both;
}

.hero-price {
  font-family: 'Questrial', sans-serif;
  font-size: 0.45rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: rgba(201,169,110,0.5);
  margin-bottom: 3px;
  animation: fadeUp 1s 0.8s both;
}

.hero-access {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: 0.75rem;
  color: rgba(232,213,176,0.4);
  margin-bottom: 30px;
  animation: fadeUp 1s 0.9s both;
}

.hero-cta {
  display: inline-block;
  font-family: 'Questrial', sans-serif;
  font-size: 0.5rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: #e8d5b0;
  border: 1px solid rgba(201,169,110,0.3);
  padding: 10px 30px;
  text-decoration: none;
  transition: all 0.4s;
  cursor: pointer;
  animation: fadeUp 1s 1.1s both;
  background: transparent;
}
.hero-cta:hover {
  background: rgba(201,169,110,0.1);
  border-color: rgba(201,169,110,0.55);
}

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  .hero-bg img {
    object-position: 42% center;
  }
  .hero-bg::after {
    background:
      linear-gradient(to top, rgba(8,6,5,0.9) 0%, rgba(8,6,5,0.5) 35%, transparent 55%),
      linear-gradient(to bottom, rgba(8,6,5,0.15) 0%, transparent 10%);
  }
  .hero-content {
    position: relative;
    right: auto;
    top: auto;
    width: 100%;
    max-width: 300px;
    margin: auto auto 50px;
    align-self: flex-end;
  }
}
</style>
</head>
<body>

<section class="hero">
  <div class="hero-bg">
    <img src="passage-bg.jpg" alt="Passage">
  </div>

  <div class="hero-content">
    <p class="hero-verse">
      Ralentir.<br>
      Traverser un passage intérieur.<br>
      Un nouveau niveau de Toi.
    </p>

    <p class="hero-details">
      Audios · transmissions · présence
    </p>

    <p class="hero-price">1 mois · 33€</p>
    <p class="hero-access">Accès immédiat.</p>

    <a class="hero-cta" href="https://buy.stripe.com/cNieV6f5TfH87RwbOYbZe05" target="_blank">ENTER</a>
  </div>
</section>

</body>
</html>
