<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAS-SAGE 33</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body { background: #0a0808; }

/* ─── SCENE ─── */
.scene {
  position: relative;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  perspective: 1200px;
}

/* ─── CORRIDOR (behind the door) ─── */
.corridor {
  position: absolute;
  inset: 0;
  z-index: 1;
}
.corridor img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: 35% center;
  transition: transform 3s cubic-bezier(0.22, 1, 0.36, 1), filter 2.5s ease;
  transform-origin: 40% 42%;
}

/* ─── DOOR (foreground, will swing open) ─── */
.door {
  position: absolute;
  inset: 0;
  z-index: 5;
  transform-origin: left center;
  transform-style: preserve-3d;
  transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1);
}
.door img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  backface-visibility: hidden;
}

/* ─── ENTER button zone ─── */
.enter-btn {
  position: absolute;
  z-index: 10;
  left: 50%;
  top: 67.8%;
  transform: translateX(-50%);
  width: 200px;
  height: 58px;
  background: transparent;
  border: none;
  cursor: pointer;
}

/* ─── Golden light flood ─── */
.light {
  position: absolute;
  inset: 0;
  z-index: 8;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(ellipse 50% 60% at 40% 42%, rgba(218,185,120,0.8) 0%, rgba(201,169,110,0.3) 35%, transparent 65%);
  transition: opacity 1.5s ease 1s;
}

/* ─── Golden particles ─── */
#particles {
  position: absolute;
  inset: 0;
  z-index: 9;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.8s ease 0.5s;
}

/* ─── Screen wash (final fade) ─── */
.wash {
  position: absolute;
  inset: 0;
  z-index: 12;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(ellipse at 40% 42%, #f5e6c8 0%, #e8d5b0 40%, #c9a96e 100%);
  transition: opacity 1.5s ease 2s;
}

/* ═══ OPENING STATE ═══ */
.scene.opening .door {
  transform: rotateY(-105deg);
}
.scene.opening .corridor img {
  transform: scale(2);
  filter: brightness(2) saturate(0.3);
}
.scene.opening .light {
  opacity: 1;
}
.scene.opening #particles {
  opacity: 1;
}
.scene.opening .wash {
  opacity: 1;
}
.scene.opening .enter-btn {
  pointer-events: none;
  opacity: 0;
}
</style>
</head>
<body>

<div class="scene" id="scene">
  <!-- Layer 1: Corridor behind -->
  <div class="corridor">
    <img src="corridor.jpg" alt="">
  </div>

  <!-- Layer 2: Door (will swing open) -->
  <div class="door" id="door">
    <img src="door-closed.jpg" alt="PAS-SAGE 33">
  </div>

  <!-- Effects -->
  <div class="light"></div>
  <canvas id="particles"></canvas>
  <div class="wash"></div>

  <!-- Clickable ENTER -->
  <button class="enter-btn" id="enterBtn" aria-label="Entrer"></button>
</div>

<script>
// Particles
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];
let running = false;

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function spawnParticle() {
  const ox = canvas.width * 0.15 + Math.random() * canvas.width * 0.2;
  const oy = canvas.height * 0.25 + Math.random() * canvas.height * 0.35;
  return {
    x: ox, y: oy,
    vx: (Math.random() - 0.3) * 3,
    vy: (Math.random() - 0.5) * 2 - 0.5,
    size: Math.random() * 3.5 + 1,
    alpha: Math.random() * 0.8 + 0.2,
    decay: Math.random() * 0.006 + 0.002,
    color: Math.random() > 0.5 ? '225,200,158' : '201,169,110'
  };
}

function animate() {
  if (!running) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  for (let i = 0; i < 10; i++) particles.push(spawnParticle());
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.alpha -= p.decay;
    if (p.alpha <= 0) { particles.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
    ctx.fill();
  }
  requestAnimationFrame(animate);
}

// Click handler
document.getElementById('enterBtn').addEventListener('click', function() {
  document.getElementById('scene').classList.add('opening');
  running = true;
  animate();
  setTimeout(function() {
    window.location.href = 'https://buy.stripe.com/cNieV6f5TfH87RwbOYbZe05';
  }, 3500);
});
</script>
</body>
</html>
