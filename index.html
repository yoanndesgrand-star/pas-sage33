<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAS-SAGE 33</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Questrial&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;1,6..96,400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Questrial', sans-serif;
  background: #0a0808;
  color: #f5f0e8;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ─── FULL SCREEN IMAGE SECTION ─── */
.hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  overflow: hidden;
}

.hero-bg {
  position: absolute;
  inset: 0;
  z-index: 0;
}

.hero-bg img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
}

/* Dark gradient overlay on the right side for text readability */
.hero-bg::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    linear-gradient(to right, transparent 0%, transparent 30%, rgba(8,6,5,0.4) 50%, rgba(8,6,5,0.75) 70%, rgba(8,6,5,0.92) 85%),
    linear-gradient(to top, rgba(8,6,5,0.6) 0%, transparent 30%),
    linear-gradient(to bottom, rgba(8,6,5,0.3) 0%, transparent 15%);
}

/* ─── TEXT CONTENT ─── */
.hero-content {
  position: relative;
  z-index: 1;
  text-align: right;
  padding: 60px;
  max-width: 460px;
  margin-right: 5vw;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.hero-title {
  font-family: 'Bodoni Moda', serif;
  font-weight: 400;
  font-size: clamp(2.6rem, 6vw, 4rem);
  letter-spacing: 0.12em;
  line-height: 1.1;
  color: #e8d5b0;
  margin-bottom: 6px;
  animation: fadeUp 1s 0.3s both;
}

.hero-number {
  font-family: 'Bodoni Moda', serif;
  font-weight: 400;
  font-size: clamp(1.4rem, 3vw, 2rem);
  letter-spacing: 0.15em;
  color: #c9a96e;
  margin-bottom: 50px;
  animation: fadeUp 1s 0.5s both;
}

.hero-line {
  width: 40px;
  height: 1px;
  background: #c9a96e;
  margin-left: auto;
  margin-bottom: 50px;
  opacity: 0.5;
  animation: fadeUp 1s 0.6s both;
}

.hero-verse {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(1.1rem, 2.2vw, 1.35rem);
  line-height: 2.2;
  color: rgba(245,240,232,0.85);
  margin-bottom: 44px;
  animation: fadeUp 1s 0.7s both;
}

.hero-details {
  font-family: 'Questrial', sans-serif;
  font-size: 0.65rem;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: rgba(201,169,110,0.7);
  line-height: 2.4;
  margin-bottom: 40px;
  animation: fadeUp 1s 0.9s both;
}

.hero-price {
  font-family: 'Bodoni Moda', serif;
  font-weight: 400;
  font-size: clamp(1.2rem, 2.5vw, 1.6rem);
  letter-spacing: 0.08em;
  color: #e8d5b0;
  margin-bottom: 6px;
  animation: fadeUp 1s 1s both;
}

.hero-access {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: 0.95rem;
  color: rgba(245,240,232,0.5);
  margin-bottom: 50px;
  animation: fadeUp 1s 1.1s both;
}

.hero-cta {
  display: inline-block;
  font-family: 'Questrial', sans-serif;
  font-size: 0.7rem;
  letter-spacing: 0.4em;
  text-transform: uppercase;
  color: #0a0808;
  background: linear-gradient(135deg, #d4bc8a, #c9a96e);
  padding: 18px 52px;
  text-decoration: none;
  transition: all 0.4s;
  cursor: pointer;
  animation: fadeUp 1s 1.3s both;
}
.hero-cta:hover {
  background: linear-gradient(135deg, #c9a96e, #d4bc8a);
  box-shadow: 0 0 40px rgba(201,169,110,0.3);
  transform: translateY(-2px);
}

/* ─── RESPONSIVE ─── */
@media (max-width: 768px) {
  .hero {
    justify-content: center;
    align-items: flex-end;
  }
  .hero-bg::after {
    background:
      linear-gradient(to top, rgba(8,6,5,0.95) 0%, rgba(8,6,5,0.7) 40%, transparent 70%),
      linear-gradient(to bottom, rgba(8,6,5,0.3) 0%, transparent 20%);
  }
  .hero-content {
    text-align: center;
    margin-right: 0;
    padding: 40px 30px 60px;
    max-width: 100%;
  }
  .hero-line {
    margin: 0 auto 40px;
  }
}
</style>
</head>
<body>

<section class="hero">
  <div class="hero-bg">
    <img src="passage-bg.jpg" alt="Passage">
  </div>

  <div class="hero-content">
    <h1 class="hero-title">PAS-SAGE</h1>
    <p class="hero-number">33</p>
    <div class="hero-line"></div>

    <p class="hero-verse">
      Ralentir.<br>
      Traverser un passage intérieur.<br>
      Un nouveau niveau de Toi.
    </p>

    <p class="hero-details">
      Audios · transmissions · présence
    </p>

    <p class="hero-price">1 mois · 33€</p>
    <p class="hero-access">Accès immédiat.</p>

    <a class="hero-cta" href="#">ENTER</a>
  </div>
</section>

</body>
</html>
