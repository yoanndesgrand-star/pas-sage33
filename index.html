<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PAS-SAGE 33</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Questrial&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,700;1,6..96,400&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  background:#0a0808;
  font-family:'Questrial',sans-serif;
  color:#f5f0e8;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

/* ─── IMAGE ─── */
.img-wrap{
  position:relative;width:100%;overflow:hidden;
}
.img-wrap img{
  width:100%;display:block;
  transition:transform 4s cubic-bezier(.1,.4,.2,1),filter 3.5s cubic-bezier(.1,.4,.2,1);
  transform-origin:40% 28%;
}
/* Gradient fade at the bottom of the image into the background */
.img-fade{
  position:absolute;bottom:0;left:0;right:0;height:40%;
  background:linear-gradient(to bottom,transparent 0%,#1a1410 60%,#0f0c09 100%);
  pointer-events:none;
}

/* ─── TEXT SECTION ─── */
.content{
  background:linear-gradient(to bottom,#0f0c09 0%,#0a0808 100%);
  text-align:center;
  padding:10px 32px 60px;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(18px)}
  to{opacity:1;transform:translateY(0)}
}
.verse{
  font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;
  font-size:clamp(1.2rem,4.5vw,1.55rem);line-height:2.3;
  color:rgba(228,205,162,.88);margin-bottom:28px;
  animation:fadeUp 1s .3s both;
}
.sep{
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:28px;animation:fadeUp 1s .5s both;
}
.sep .l{width:26px;height:1px;background:rgba(200,170,120,.3)}
.sep .d{width:5px;height:5px;background:rgba(200,170,120,.4);transform:rotate(45deg)}

.details{
  font-size:.6rem;letter-spacing:.28em;text-transform:uppercase;
  color:rgba(200,170,120,.42);margin-bottom:24px;
  animation:fadeUp 1s .6s both;
}
.price{
  font-family:'Bodoni Moda',serif;font-weight:400;
  font-size:clamp(1.15rem,4vw,1.5rem);letter-spacing:.06em;
  color:rgba(228,205,162,.82);margin-bottom:5px;
  animation:fadeUp 1s .7s both;
}
.access{
  font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;
  font-size:.92rem;color:rgba(200,170,120,.38);margin-bottom:36px;
  animation:fadeUp 1s .8s both;
}
.enter-btn{
  font-family:'Questrial',sans-serif;font-size:.65rem;
  letter-spacing:.4em;text-transform:uppercase;
  color:rgba(228,205,162,.85);background:transparent;
  border:1px solid rgba(200,170,120,.28);
  padding:15px 48px;cursor:pointer;transition:all .4s;
  animation:fadeUp 1s 1s both;
}
.enter-btn:hover{
  background:rgba(200,170,120,.08);
  border-color:rgba(200,170,120,.5);
}

/* ─── EFFECTS ─── */
.light{
  position:fixed;inset:0;z-index:20;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse 60% 55% at 40% 15%,rgba(240,210,150,1) 0%,rgba(220,188,125,.5) 30%,transparent 60%);
}
.wash{
  position:fixed;inset:0;z-index:22;pointer-events:none;opacity:0;
  background:radial-gradient(ellipse at 40% 15%,#f5e6c8,#e8d5b0 40%,#c9a96e);
  transition:opacity 1.5s ease 2s;
}

/* ═══ ANIMATION STATE ═══ */
body.go{overflow:hidden}
body.go .img-wrap img{transform:scale(6);filter:brightness(4) saturate(0);transition:transform 4s cubic-bezier(.1,.4,.2,1),filter 3.5s cubic-bezier(.1,.4,.2,1)}
body.go .img-fade{opacity:0;transition:opacity .4s ease}
body.go .content{opacity:0;transition:opacity .3s ease}
body.go .light{opacity:1;transition:opacity 1s ease .3s}
body.go .wash{opacity:1;transition:opacity 1.2s ease 2.5s}
</style>
</head>
<body>

<!-- Image -->
<div class="img-wrap">
  <img src="corridor.jpg" alt="PAS-SAGE 33">
  <div class="img-fade"></div>
</div>

<!-- Text -->
<div class="content">
  <p class="verse">
    Traverser un passage intérieur.<br>
    Un nouveau niveau de toi.
  </p>
  <div class="sep"><span class="l"></span><span class="d"></span><span class="l"></span></div>
  <p class="details" style="font-family:'Cormorant Garamond',serif;font-size:.95rem;font-style:italic;letter-spacing:.02em;text-transform:none;color:rgba(228,205,162,.6);line-height:2.2;margin-bottom:28px">
    Qui appellent à :<br>
    — ralentir<br>
    — ressentir<br>
    — habiter ce qui est déjà là
  </p>
  <p class="access" style="margin-bottom:12px;color:rgba(228,205,162,.7);font-size:.95rem">
    En décidant de te célébrer chaque jour.
  </p>
  <p class="access" style="margin-bottom:36px;color:rgba(228,205,162,.7);font-size:.95rem">
    En décrétant que le champ des possibles<br>est d'or et déjà ouvert.
  </p>
  <div class="sep"><span class="l"></span><span class="d"></span><span class="l"></span></div>
  <p class="price" style="font-size:clamp(1.3rem,4.5vw,1.7rem);margin-bottom:8px">PAS-SAGE 33</p>
  <p class="details" style="margin-bottom:4px">1 mois</p>
  <p class="price" style="margin-bottom:32px">33€</p>
  <button class="enter-btn" id="enterBtn">E N T E R</button>
</div>

<!-- Effects -->
<div class="light"></div>
<div class="wash"></div>

<script>
document.getElementById('enterBtn').addEventListener('click',function(){
  window.scrollTo({top:0,behavior:'smooth'});
  setTimeout(()=>{document.body.classList.add('go')},200);
  setTimeout(()=>{location.href='https://buy.stripe.com/cNieV6f5TfH87RwbOYbZe05'},4000);
})
</script>
</body>
</html>
